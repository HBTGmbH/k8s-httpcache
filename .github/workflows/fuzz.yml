name: Fuzz

on:
  # Fuzzing is change-driven, not scheduled: a nightly run over an unchanged
  # tree only burns runners, so the targets run when the code they cover moves.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Duration to fuzz each target (e.g. 3m, 30m, 2h)
        type: string
        default: 3m

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs; never interrupt a run on main or a manual long run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    if: >-
      github.event_name != 'push' ||
      (!startsWith(github.event.head_commit.message, 'docs:') &&
      !startsWith(github.event.head_commit.message, 'docs('))
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 20
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
      id: filter
      with:
        # Any Go change can reach a fuzz target: the fuzzed packages import each
        # other (renderer -> watcher, varnish -> redact/telemetry), so gating per
        # package would silently skip targets whose transitive deps moved.
        filters: |
          go:
            - '**/*.go'
            - 'go.mod'
            - 'go.sum'
            - '.github/workflows/fuzz.yml'

  fuzz:
    # Go fuzzing runs one target per invocation, so fan out over every Fuzz*
    # function. Keep this list in sync when adding fuzz tests.
    name: Fuzz ${{ matrix.func }}
    needs: [changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: internal/config
            func: FuzzListenAddrSet
          - pkg: internal/config
            func: FuzzBackendSet
          - pkg: internal/config
            func: FuzzParseNamespacedService
          - pkg: internal/renderer
            func: FuzzInjectDrainVCL
          - pkg: internal/renderer
            func: FuzzRender
          - pkg: internal/varnish
            func: FuzzSanitizeCertFileNameNoTraversal
          - pkg: internal/varnish
            func: FuzzCombinePEM
          - pkg: internal/varnish
            func: FuzzPrefixWriter
          - pkg: internal/redact
            func: FuzzRedact
          - pkg: internal/redact
            func: FuzzRedactNestedSecrets
          - pkg: internal/telemetry
            func: FuzzParseVarnishstat
          - pkg: internal/telemetry
            func: FuzzCollect
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Setup Go
      # zizmor: ignore[cache-poisoning]
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version-file: go.mod
    - name: Fuzz
      # Matrix values pass through env (not interpolated into the shell) so the
      # run block has no ${{ }} expansion. FUZZTIME falls back to 3m when the run
      # was not started manually.
      env:
        PKG: ${{ matrix.pkg }}
        FUNC: ${{ matrix.func }}
        FUZZTIME: ${{ inputs.fuzztime || '3m' }}
      run: go test -run='^$' -fuzz="^${FUNC}\$" -fuzztime="$FUZZTIME" "./${PKG}/"
    - name: Upload crashers
      # On a crash, Go writes the failing input under testdata/fuzz/<Func>/; keep
      # it so the reproducer can be committed to the seed corpus.
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: fuzz-crashers-${{ matrix.func }}
        path: ${{ matrix.pkg }}/testdata/fuzz/${{ matrix.func }}/
        if-no-files-found: ignore
