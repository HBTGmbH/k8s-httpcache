version: 2
updates:
# Each Varnish major version is tested separately in the CI matrix.
# We treat Varnish 6 differently because we only want its 6.0.x updates,
# not the 6.6.x, which also exists in Docker Hub (but was uploaded more
# than four years ago).
# varnish6: patch-only (6.0.x is the final 6.x minor release)
# varnish7: minor + patch
# varnish8: minor + patch
# varnish9: minor + patch, covering both the plain and the race-detector leg
- package-ecosystem: docker
  directory: /.github/test/varnish6
  schedule:
    interval: weekly
  cooldown:
    default-days: 7  # wait a week before adopting a fresh release (supply-chain hygiene)
  ignore:
  - dependency-name: varnish
    update-types:
    - "version-update:semver-major"
    - "version-update:semver-minor"

- package-ecosystem: docker
  directory: /.github/test/varnish7
  schedule:
    interval: weekly
  cooldown:
    default-days: 7  # wait a week before adopting a fresh release (supply-chain hygiene)
  ignore:
  - dependency-name: varnish
    update-types:
    - "version-update:semver-major"

- package-ecosystem: docker
  directory: /.github/test/varnish8
  schedule:
    interval: weekly
  cooldown:
    default-days: 7  # wait a week before adopting a fresh release (supply-chain hygiene)
  ignore:
  - dependency-name: varnish
    update-types:
    - "version-update:semver-major"

# varnish9-race re-runs the varnish9 E2E leg under the race detector, so it is
# only a valid mirror while both run the identical varnish image (enforced by
# .github/test/script-selftest.sh). It also has its own golang build stage.
# Both directories therefore share one entry, and group-by: dependency-name
# makes dependabot raise a single PR per dependency across them, so the two
# varnish pins can never drift apart. Listing only /.github/test/varnish9 left
# the race leg's base images frozen forever.
- package-ecosystem: docker
  directories:
  - /.github/test/varnish9
  - /.github/test/varnish9-race
  schedule:
    interval: weekly
  cooldown:
    default-days: 7  # wait a week before adopting a fresh release (supply-chain hygiene)
  groups:
    varnish9:
      patterns:
      - "*"
      group-by: dependency-name
  ignore:
  - dependency-name: varnish
    update-types:
    - "version-update:semver-major"

- package-ecosystem: gomod
  directory: /
  schedule:
    interval: weekly
  cooldown:
    default-days: 7  # wait a week before adopting a fresh release (supply-chain hygiene)
  groups:
    go-modules:
      patterns:
      - "*"

- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  cooldown:
    default-days: 7  # wait a week before adopting a fresh release (supply-chain hygiene)
  groups:
    github-actions:
      patterns:
      - "*"

# Pinned markdownlint-cli used by the Markdown lint CI step (see test-and-build.yml).
- package-ecosystem: npm
  directory: /.github/markdownlint
  schedule:
    interval: weekly
  cooldown:
    default-days: 7  # wait a week before adopting a fresh release (supply-chain hygiene)
  groups:
    markdownlint:
      patterns:
      - "*"
